[build]
target = "xtensa-esp32s3-espidf"

[target.xtensa-esp32s3-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s3"
ESP_IDF_VERSION = "v5.4"
ESP_IDF_TOOLS_INSTALL_DIR = "global"
CRATE_CC_NO_DEFAULTS = "1"
# Use the self-contained S3 sdkconfig (do NOT mix in the C3 base sdkconfig.defaults)
ESP_IDF_SDKCONFIG_DEFAULTS = "sdkconfig.defaults.esp32s3"
ESP_IDF_GLOB_0_BASE = { value = "", relative = true }
ESP_IDF_GLOB_0_0 = "partitions.csv"
